<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Daily Tracker</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b0b0e;
        color: #ededf0;
        text-align: center;
        padding: 24px;
      }
      .badge {
        width: 56px; height: 56px; border-radius: 14px;
        background: #4f46e5; color: #fff;
        display: grid; place-items: center;
        font-size: 28px; margin: 0 auto 16px;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #9ca3af; max-width: 320px; margin: 0 auto; line-height: 1.5; }
      button {
        margin-top: 20px; padding: 10px 18px; border-radius: 10px;
        border: 0; background: #4f46e5; color: #fff; font: inherit; cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="badge">✓</div>
      <h1>You're offline</h1>
      <p>
        Daily Tracker can't reach the network right now. Any pages you've
        already opened are still available — reconnect to sync and load fresh
        data.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
